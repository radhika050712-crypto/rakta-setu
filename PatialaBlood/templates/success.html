<!DOCTYPE html>
<html>
<head>
    <title>Submission Status</title>

        body { font-family: Arial; text-align: center; padding: 50px; background: #f2f2f2; }
        .box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px #ccc; }
        .btn { padding: 10px 20px; background: #e63946; color: white; text-decoration: none; border-radius: 5px; margin: 5px; }

    <div class="box">
        <h2>{{ message }}</h2>
        <br>
        <a href="/" class="btn">Go to Home</a>

    </div>
</body>
</html>
