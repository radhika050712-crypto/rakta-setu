<!DOCTYPE html>
<html>
<head>
    <title>RaktSetu Patiala - Home</title>
    <style>
        body {font-family: 'Segoe UI', Arial; background: #fff0f5; margin: 0; padding: 0;}

        /* HEADER with image */
       .header {background: url('https://images.unsplash.com/photo-1615461066841-6116e61058f4?w=1200') center/cover;
                 height: 250px; display: flex; align-items: center; justify-content: center; color: white; text-shadow: 2px 2px 4px #000;}
       .header h1 {font-size: 40px; background: rgba(255,0,0,0.7); padding: 15px 30px; border-radius: 10px;}

       .container {max-width: 1000px; margin: -50px auto 20px auto; padding: 20px;}

        /* 2 BIG BUTTONS */
       .menu {display: flex; gap: 30px; justify-content: center; margin: 30px 0;}
       .card {background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
               text-align: center; width: 300px; transition: 0.3s;}
       .card:hover {transform: translateY(-5px); box-shadow: 0 8px 25px rgba(255,0,0,0.2);}
       .card h2 {color: red;}
       .card a {display: block; background: red; color: white; padding: 15px; text-decoration: none;
                 border-radius: 8px; font-size: 18px; margin-top: 15px;}
       .card a:hover {background: darkred;}

        /* SEARCH BOX */
       .box {background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 30px;}
        input, select {width: 95%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ddd; border-radius: 5px;}
        button {background: red; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer;}
        button:hover {background: darkred;}

        table {width: 100%; border-collapse: collapse; margin-top: 15px; background: white;}
        th {background: red; color: white; padding: 12px;}
        td {padding: 10px; text-align: center; border: 1px solid #ddd;}
      .delete {background: #333; padding: 6px 12px;}
        footer {text-align: center; padding: 20px; color: #555; margin-top: 30px;}
        .btn {
            display: inline-block;
            padding:12px 24px;
            background: red;
            color:white;
            text-decoration:none;
            border-radius:8px;
            border:none;
            cursor:pointer;
            font-weight:bold;
            margin:10px 0;
        }
        .btn:hover { background: darkred;}
    </style>
</head>
<body>
    <div class="header">
        <h1>🩸 RaktSetu Patiala 🩸</h1>
    </div>

    <div class="container">
        <div class="menu">
            <div class="card">
                <h2>Become a Donor</h2>
                <p>रक्तदान करें, जीवन बचाएं</p>
                <a href="/register">Register Now</a>
            </div>
            <div class="card">
                <h2>Find Donor</h2>
                <p>जरूरतमंद के लिए खोजें</p>
                <a href="#search">Search Now</a>
            </div>
        </div>

        <div class="box" id="search">
            <h2 style="color:red;">Search Donor in Patiala</h2>
            
            <form action="/search" method="POST">
                <label>Select Blood Group</label>
                <select name="blood_group">
                    <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                    <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
                </select>
                <label>City</label><input name="city" value="Patiala">
                <button type="submit">Search Donor</button>
            </form>
        </div>
      <!-- AI Health Check Box -->
<div class="fitness-check" style="margin:30px 0; padding:20px; background:white; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.1);">
    <h3>📷 AI Donor Fitness Check</h3>
    <p>Camera से Donor की Basic Health Check करें। Demo के लिए है।</p>

    <video id="video" width="320" height="240" autoplay style="margin:10px 0; border-radius:10px; border:3px solid red; display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <a href="#" class="btn" id="cameraBtn">Start Camera Check</a>

    <!-- Result yahan aayega -->
    <div id="fitness-result" style="margin-top:15px;"></div>
</div>

<script>
const video = document.getElementById('video');
const btn = document.getElementById('cameraBtn');
let stream = null;

btn.onclick = async function(e) {
    e.preventDefault();
    if(stream) stream.getTracks().forEach(track => track.stop());
    
    video.style.display = 'block';
    btn.innerText = 'Checking... 2 sec';
    
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        
        setTimeout(() => {
            const canvas = document.getElementById('canvas');
            canvas.width = 320; canvas.height = 240;
            canvas.getContext('2d').drawImage(video, 0, 0);
            let image_data = canvas.toDataURL('image/jpeg');
            
            stream.getTracks().forEach(track => track.stop());
            video.style.display = 'none';
            stream = null;
            btn.innerText = 'Start Camera Check';

            fetch('/check_fitness', {
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({image: image_data})
            })
            .then(res => res.json())
            .then(data => {
                let resultDiv = document.getElementById('fitness-result');
                let color = data.status.includes('Fit') ? 'green' : 'red';
                resultDiv.innerHTML = `<div style="padding:15px; background:#f8f9fa; border-radius:8px;"><h4 style="color:${color};">${data.status}</h4><ul>${data.reasons.map(r => `<li>${r}</li>`).join('')}</ul></div>`;
            })
            .catch(err => console.log(err));

        }, 2000);
    } catch(err) { 
        alert("Camera Error: " + err); 
        btn.innerText = 'Start Camera Check'; 
    }
}
</script>
</body>
</html>
